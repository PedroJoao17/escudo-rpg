name: Sincronizar Tailwind temporariamente

on:
  push:
    paths:
      - .github/tailwind-install.trigger

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar Tailwind no workspace web
        run: npm install --save-dev --workspace @escudo/web tailwindcss@4.3.3 @tailwindcss/postcss@4.3.3 postcss@8.5.29
      - name: Commitar manifests sincronizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de dependência necessária."
            exit 0
          fi
          git commit -m "build(web): instala Tailwind CSS 4"
          git push origin HEAD:main
